[package]
name = "bevy_netahoy"
version = "0.1.0"
edition = "2024"
description = "Bevy netcode helpers for Ahoy-powered character controllers."
readme = "README.md"

[lints.clippy]
# Bevy query/filter tuples routinely trip this; bevy upstream allows it too.
type_complexity = "allow"

[dependencies]
aeronet = "0.21.0"
aeronet_replicon = { version = "0.21.0", default-features = false, features = ["client"] }
avian3d = { version = "0.7", default-features = false, features = ["3d", "f32", "parry-f32", "parallel"] }
bitflags = { version = "2", features = ["serde"] }
bevy = { version = "0.19", default-features = false, features = ["async_executor", "bevy_log", "bevy_state", "multi_threaded", "serialize"] }
bevy_ahoy = { path = "../bevy_ahoy", default-features = false, features = ["serialize"] }
bevy_replicon = { version = "0.41", default-features = false, features = ["client", "server"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
aeronet_replicon = { version = "0.21.0", default-features = false, features = ["client", "server"] }
aeronet_websocket = { version = "0.21.0", default-features = false, features = ["client", "server"] }
ahoy_replicon = { path = "examples/ahoy_replicon" }
bevy_enhanced_input = "0.26"
postcard = { version = "1", features = ["alloc"] }

[[example]]
name = "ahoy_client"
path = "examples/ahoy_replicon/client.rs"

[[example]]
name = "ahoy_server"
path = "examples/ahoy_replicon/server.rs"

[profile.win-dev]
inherits = "dev"
strip = "debuginfo"

[profile.win-dev.package."*"]
opt-level = 3
